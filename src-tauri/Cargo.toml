[package]
name = "padrosdown"
version = "0.1.0"
description = "Linux-first, open-file Markdown workspace"
authors = ["padrosdown contributors"]
edition = "2021"

[lib]
name = "padrosdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"

[dev-dependencies]
tempfile = "3"
